    <!-- Google tag (gtag.js): solo se carga si la persona ya aceptó el
         aviso de cookies (ver el botón "Aceptar" del banner de AdSense
         dentro de la app, en BannerAd.web.tsx) — antes cargaba sin
         ningún consentimiento. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        if (localStorage.getItem('recos:cookieConsent') !== 'accepted') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-65SN5082YE';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-65SN5082YE');
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->

    <div id="root"></div>
  </body>
